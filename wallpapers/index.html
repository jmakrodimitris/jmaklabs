<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif;background:#09131b;color:#eef3f5}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top right,#243c48,transparent 70%);min-height:100vh}a{color:inherit} button{display:inline-block;border:1px solid #b99469;border-radius:10px;background:#13232d;color:#edc393;padding:12px 18px;text-decoration:none;font:inherit;cursor:pointer}main{max-width:1150px;margin:20px auto;padding:0 24px 60px}h1{font-size:clamp(34px,6vw,58px);letter-spacing:-.045em;margin:12px 0}.eyebrow{color:#edc393;letter-spacing:.18em;font-size:12px;text-transform:uppercase}.intro,#status{color:#afc1ca;line-height:1.6}.tools{display:flex;gap:12px;margin:28px 0 16px}input{flex:1;min-width:0;background:#12242f;color:white;border:1px solid #46606e;border-radius:10px;padding:14px;font:inherit}a:focus-visible,button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #edc393;outline-offset:4px}details{margin:12px 0;border:1px solid #344b58;border-radius:12px;background:#10212bd9;padding:14px}summary{cursor:pointer;overflow-wrap:anywhere;font-weight:600;color:#edc393}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;margin-top:16px}.file{display:flex;flex-direction:column;overflow:hidden;border:1px solid #344b58;border-radius:12px;text-decoration:none;background:#172c38}.file:hover{border-color:#edc393}.file img{width:100%;height:160px;object-fit:cover;background:#0a1820}.icon{display:grid;place-items:center;height:100px;color:#edc393;font-size:28px}.name{padding:14px;overflow-wrap:anywhere;font-size:14px}.empty{padding:24px 0;color:#afc1ca}@media(max-width:480px){main{padding:0 16px 40px}.tools{flex-wrap:wrap}.grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}.file img{height:130px}}@media(prefers-reduced-motion:no-preference){.file{transition:border-color .2s}}

.brand-wordmark{position:absolute;top:18px;right:24px;width:150px;text-align:center;color:#fff;text-shadow:0 3px 10px #0008;text-decoration:none;z-index:10}.brand-main{display:block;font-family:Impact,"Arial Black",sans-serif;font-size:46px;font-weight:900;font-style:italic;letter-spacing:-2px;line-height:1.05;transform:skew(-8deg)}.brand-sub{display:block;margin-top:5px;font-size:12px;font-weight:600;letter-spacing:5px;white-space:nowrap}@media(max-width:360px){.brand-wordmark{right:16px;width:125px}.brand-main{font-size:40px}.brand-sub{font-size:10px;letter-spacing:4px}}
.brand-wordmark:focus-visible { outline: 3px solid #edc393; outline-offset: 6px; border-radius: 4px; }
    .holiday-lights {
      position: absolute;
      inset: 0 0 auto;
      display: flex;
      height: 30px;
      pointer-events: none;
    }
    .holiday-lights span {
      --bulb: #ffce81;
      flex: 1;
      position: relative;
      height: 16px;
      border-bottom: 2px solid #36534a;
      border-radius: 0 0 50% 50%;
    }
    .holiday-lights span:nth-child(3n + 1) { --bulb: #ff717c; }
    .holiday-lights span:nth-child(3n + 2) { --bulb: #84dbb6; }
    .holiday-lights span::after {
      content: "";
      position: absolute;
      top: 100%;
      left: 50%;
      width: 7px;
      height: 11px;
      border-top: 3px solid #36534a;
      border-radius: 2px 2px 50% 50%;
      background: var(--bulb);
      box-shadow: 0 3px 11px var(--bulb);
      transform: translateX(-50%);
    }

    .brand-sub { color: #ffe7da; }
    @supports (background-clip: text) {
      .brand-main {
        background-image: repeating-linear-gradient(135deg, #fff8ef 0 9px, #e8475a 9px 15px);
        background-clip: text;
        color: transparent;
        text-shadow: none;
        filter: drop-shadow(0 2px 4px #000b);
      }
    }

    #refresh {
      background: linear-gradient(160deg, #17382f, #0c1c23 78%) padding-box,
                  repeating-linear-gradient(135deg, #e65365 0 7px, #ffefda 7px 14px) border-box;
      border: 2px solid transparent;
    }
    #refresh:hover {
      border-color: transparent;
      box-shadow: 0 12px 35px #0005, 0 0 16px #ffbf7b38;
      background: linear-gradient(160deg, #215044, #112927 78%) padding-box,
                  repeating-linear-gradient(135deg, #ff6575 0 7px, #fff5e8 7px 14px) border-box;
    }
    #refresh::before {
      background: linear-gradient(110deg, transparent 42%, #ffd08c30 50%, transparent 58%) 100% 0 / 300% 100% no-repeat;
    }

    @media (max-width: 480px) {
      .holiday-lights span:nth-child(even) { display: none; }
    }
    .snowfall {
      position: fixed;
      inset: 0;
      z-index: -1;
      overflow: hidden;
      pointer-events: none;
    }
    .snowfall span, .landing-flake {
      position: absolute;
      border-radius: 50%;
      background: #f6fbff;
      pointer-events: none;
    }
    .snowfall span {
      top: -12px;
      left: var(--left);
      width: var(--size);
      height: var(--size);
      opacity: var(--opacity);
      box-shadow: 0 0 5px #e4f1ff70;
      animation: snowfall var(--duration) var(--delay) linear infinite;
    }
    @keyframes snowfall {
      from { transform: translate3d(0, 0, 0); }
      to { transform: translate3d(var(--drift), calc(100vh + 24px), 0); }
    }

    #refresh::after {
      content: "";
      position: absolute;
      top: -5px;
      left: 18%;
      width: 48%;
      height: 6px;
      border-radius: 65% 85% 36% 48%;
      background: linear-gradient(#fff, #c9e3ff);
      box-shadow: 0 2px 5px #b5d8ff50;
      pointer-events: none;
    }

    .landing-flake {
      top: -7px;
      left: 46%;
      width: 4px;
      height: 4px;
      opacity: 0;
      animation: settle-on-button 5.8s linear infinite;
    }
    @keyframes settle-on-button {
      0%, 38% { opacity: 0; transform: translate(-9px, -25px); }
      47% { opacity: .8; }
      73% { opacity: .9; transform: translate(0, 0); }
      85% { opacity: 0; transform: translate(0, 0); }
      100% { opacity: 0; }
    }
    @media (max-width: 480px) {
      .snowfall span:nth-child(3n) { display: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      .snowfall, .landing-flake { display: none; }
    }
    @keyframes shimmer {
      0%, 65% { background-position: 100% 0; }
      90%, 100% { background-position: 0 0; }
    }

    :root { background: #030711; color: #fff8ed; }
    body {
      isolation: isolate;
      background: radial-gradient(ellipse at 50% 38%, #0a1424 0%, #030711 68%);
    }
    .brand-wordmark { top: 46px; }
    main { margin-top: 0; padding-top: 7.5rem; }
    .holiday-header { text-align: center; }
    .holiday-art {
      display: block;
      width: 100%;
      max-width: 34rem;
      height: auto;
      margin: 0 auto;
      mask-image: linear-gradient(to right, transparent, #000 19%, #000 81%, transparent),
                  linear-gradient(to bottom, transparent, #000 15%, #000 76%, transparent);
      mask-composite: intersect;
    }

    .eyebrow, summary, .icon { color: #ffd09b; }
    .intro, #status, .empty { color: #ced9e8; }
    input { border-color: #506a60; background: #0c1c23; }
    details { border-color: #36534a; background: #10241fd9; }
    .file { border-color: #36534a; background: #17382f; }
    .file:hover { border-color: #ffd09b; }
    #refresh { position: relative; color: #fff8ed; }
    #refresh::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
      animation: shimmer 7s ease-in-out infinite;
    }
    #refresh:disabled { opacity: .65; cursor: wait; }
    @media (prefers-reduced-motion: reduce) {
      #refresh::before { animation: none; }
    }
</style>

<main>
<header class="holiday-header">
<img class="holiday-art" src="backgrounds/jmaklabs_christmas.png" width="800" height="480" alt="">
<p class="eyebrow">Merry Christmas from JMAK Labs!</p>
<h1>Wallpapers</h1>
<p class="intro">Explore the collection. Open a wallpaper to view or save the original.</p>
</header>
<div class="tools"><input id="search" type="search" aria-label="Search files and folders" placeholder="Search files and folders…"><button id="refresh" type="button"><span class="landing-flake" aria-hidden="true"></span>Refresh</button></div>
<p id="status" role="status" aria-live="polite">Loading collection…</p>
<section id="collection" aria-label="Files and folders"></section>
</main>
<script>
'use strict';
const REPO = 'jmakrodimitris/jmaklabs';
const ROOT = 'wallpapers/';
const API = 'https://api.github.com/repos/' + REPO;
const collection = document.querySelector('#collection');
const status = document.querySelector('#status');
const search = document.querySelector('#search');
let entries = [], branch, busy = false, loaded = false, signature = '';
const imagePattern = /\.(avif|gif|jpe?g|png|webp|bmp|ico)$/i;
async function getJSON(url) {
  const response = await fetch(url, {cache:'no-store',headers:{Accept:'application/vnd.github+json'}});
  if (!response.ok) throw new Error(response.status === 403 || response.status === 429 ? 'GitHub’s request limit was reached. Please try again later.' : 'Unable to load the collection from GitHub (' + response.status + ').');
  return response.json();
}
function render() {
  const opened = new Set([...collection.querySelectorAll('details[open]')].map(d => d.dataset.path));
  collection.replaceChildren();
  const query = search.value.trim().toLowerCase();
  const filtered = entries.filter(item => item.path.toLowerCase().includes(query));
  const root = {folders:new Map(),files:[]};
  for (const item of filtered) {
    const parts = item.path.split('/');
    let node = root;
    const directories = item.type === 'tree' ? parts : parts.slice(0,-1);
    for (const part of directories) {
      if (!node.folders.has(part)) node.folders.set(part,{folders:new Map(),files:[]});
      node = node.folders.get(part);
    }
    if (item.type === 'blob') node.files.push(item);
  }
  function append(node, parent, path='') {
    for (const [name,child] of [...node.folders].sort(([a],[b])=>a.localeCompare(b))) {
      const folderPath = path + name + '/';
      const details = document.createElement('details');
      details.dataset.path = folderPath;
      details.open = !!query || opened.has(folderPath);
      const summary = document.createElement('summary');
      summary.textContent = name;
      details.append(summary); append(child,details,folderPath); parent.append(details);
    }
    if (!node.files.length) return;
    const grid = document.createElement('div'); grid.className='grid';
    for (const item of node.files.sort((a,b)=>a.path.localeCompare(b.path))) {
      const link = document.createElement('a'); link.className='file';
      link.href = './'+item.path.split('/').map(encodeURIComponent).join('/');
      link.target='_blank'; link.rel='noopener';
      if (imagePattern.test(item.path)) {
        const img=document.createElement('img'); img.alt=''; img.loading='lazy';
        img.src=link.href+'?v='+item.sha;
        img.addEventListener('error',()=>{const fallback=document.createElement('span');fallback.className='icon';fallback.textContent='Image';img.replaceWith(fallback);},{once:true});
        link.append(img);
      } else {const icon=document.createElement('span');icon.className='icon';icon.textContent='File';link.append(icon);}
      const label=document.createElement('span');label.className='name';label.textContent=item.path.split('/').pop();link.append(label);grid.append(link);
    }
    parent.append(grid);
  }
  append(root,collection);
  if (!filtered.length) {const empty=document.createElement('p');empty.className='empty';empty.textContent=query?'No files or folders match your search.':'No files yet. New additions will appear here automatically.';collection.append(empty);}
}
async function refresh() {
  if (busy) return;
  busy=true; document.querySelector('#refresh').disabled=true;
  try {
    if (!branch) branch=(await getJSON(API)).default_branch;
    const data=await getJSON(API+'/git/trees/'+encodeURIComponent(branch)+'?recursive=1');
    if (data.truncated) throw new Error('This repository is too large for a complete listing. Please use the GitHub folder to browse all files.');
    const next=data.tree.filter(item=>item.path.startsWith(ROOT) && ['blob','tree'].includes(item.type) && !/^wallpapers\/index(?:_\d+)?\.html$/.test(item.path)).map(item=>({...item,path:item.path.slice(ROOT.length)}));
    const nextSignature=JSON.stringify(next.map(item=>[item.path,item.sha]));
    if (!loaded || nextSignature!==signature) {entries=next;signature=nextSignature;render();}
    loaded=true;
    const files=entries.filter(item=>item.type==='blob').length;
    status.textContent=files+' file'+(files===1?'':'s')+' · Checks for updates every 2 minutes · Checked '+new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
  } catch(error) {
    status.textContent=(loaded?'Showing the previous listing. ':'')+error.message;
    const link=document.createElement('a');link.href='https://github.com/'+REPO+'/tree/'+encodeURIComponent(branch||'HEAD')+'/wallpapers';link.textContent=' Browse on GitHub';status.append(link);
  } finally {busy=false;document.querySelector('#refresh').disabled=false;}
}
search.addEventListener('input',render);
document.querySelector('#refresh').addEventListener('click',refresh);
setInterval(()=>{if(!document.hidden)refresh();},120000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh();});
refresh();
</script>
