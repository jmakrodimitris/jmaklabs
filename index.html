  <style>
    * { box-sizing: border-box; }
    html { min-height: 100%; background: #09131b; }
    body { margin: 0; min-height: 100vh; min-height: 100svh; color: #fff; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body {
      background-color: #09131b;
      background-image: linear-gradient(180deg, rgb(3 10 16 / 8%) 35%, rgb(3 10 16 / 20%) 60%, rgb(3 10 16 / 85%) 100%), url("wallpapers/backgrounds/home-sunset.png");
      background-position: center;
      background-size: cover;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }
    main { min-height: 100vh; min-height: 100svh; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; padding: 8rem 1.25rem max(2rem, env(safe-area-inset-bottom)); }
    .brand-wordmark{position:absolute;top:18px;right:24px;width:150px;text-align:center;color:#fff;text-shadow:0 3px 10px #0008;text-decoration:none;z-index:10}.brand-main{display:block;font-family:Impact,"Arial Black",sans-serif;font-size:46px;font-weight:900;font-style:italic;letter-spacing:-2px;line-height:1.05;transform:skew(-8deg)}.brand-sub{display:block;margin-top:5px;font-size:12px;font-weight:600;letter-spacing:5px;white-space:nowrap}
    @media (max-width: 600px) { .brand-wordmark { right: 16px; width: 125px; } .brand-main { font-size: 40px; } .brand-sub { font-size: 10px; letter-spacing: 4px; } }
    .welcome { width: min(100%, 48rem); margin: auto 0; padding: 2rem 0 3rem; text-align: center; text-shadow: 0 3px 24px rgb(0 0 0 / 65%); animation: arrive 900ms ease-out both; }
    .welcome h1 { margin: 0; font-size: clamp(2.25rem, 6vw, 4.75rem); font-weight: 650; letter-spacing: -.045em; line-height: 1.1; text-wrap: balance; }
    .welcome p { margin: 1rem 0 0; color: rgb(255 255 255 / 85%); font-size: clamp(.95rem, 2vw, 1.2rem); line-height: 1.6; text-wrap: balance; }
    .social-links { position: absolute; top: max(1.25rem, env(safe-area-inset-top)); left: 1.25rem; display: grid; grid-template-columns: repeat(4, 3rem); gap: .65rem; }
    .social-links .social-button { width: 3rem; height: 3rem; min-height: 3rem; padding: .75rem; font-family: inherit; cursor: pointer; }
    .social-button:disabled { opacity: 1; color: #fff; cursor: default; }
    .social-button svg { width: 1.5rem; height: 1.5rem; }
    @media (max-width: 480px) { .social-links { grid-template-columns: repeat(2, 3rem); gap: .5rem; } main { padding-top: 10rem; } }
    .gateway { width: min(100%, 35rem); text-align: center; padding-bottom: clamp(0rem, 4vh, 3rem); animation: arrive 900ms ease-out both; }
    .eyebrow { margin: 0 0 1rem; font-size: .7rem; font-weight: 500; letter-spacing: .32em; text-transform: uppercase; color: rgb(255 255 255 / 75%); }
    nav { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1rem; }
    .button { position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; gap: .8rem; min-height: 4rem; padding: 1rem 1.25rem; border: 1px solid rgb(255 255 255 / 35%); border-radius: 1rem; background: rgb(12 24 33 / 65%); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); box-shadow: 0 8px 30px rgb(0 0 0 / 18%); color: white; text-decoration: none; font-size: 1.05rem; font-weight: 550; transition: transform 240ms ease, border-color 240ms ease, background 240ms ease, box-shadow 240ms ease; }
    .button::before { content: ""; position: absolute; inset: 0; transform: translateX(-130%) skewX(-20deg); background: linear-gradient(90deg, transparent, rgb(255 255 255 / 15%), transparent); animation: shimmer 7s ease-in-out infinite; pointer-events: none; }
    .button:nth-child(2)::before { animation-delay: 1s; }
    .button:nth-child(3)::before { animation-delay: 2s; }
    .button:nth-child(4)::before { animation-delay: 3s; }
    .button:hover { transform: translateY(-5px); border-color: #e7b67d; background: rgb(56 45 35 / 75%); box-shadow: 0 12px 35px rgb(0 0 0 / 30%), 0 0 22px rgb(231 182 125 / 12%); }
    .button:focus-visible { outline: 3px solid #ffd09b; outline-offset: 5px; }
    .button:active { transform: translateY(-1px) scale(.98); }
    svg { width: 1.3rem; height: 1.3rem; flex-shrink: 0; }
    .arrow { margin-left: auto; color: #d7b48e; transition: transform 240ms ease; }
    .button:hover .arrow { transform: translate(2px, -2px); }
    .label { margin-right: auto; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    @keyframes arrive { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes shimmer { 0%, 65% { transform: translateX(-130%) skewX(-20deg); } 90%, 100% { transform: translateX(130%) skewX(-20deg); } }
    @media (max-width: 420px) { nav { gap: .65rem; } .button { padding: 1rem; gap: .55rem; } }
    @media (max-width: 480px) { nav { grid-template-columns: 1fr; } }
    @media (prefers-reduced-motion: reduce) { *, *::before { animation: none !important; transition: none !important; } }
  .brand-wordmark:focus-visible { outline: 3px solid #edc393; outline-offset: 6px; border-radius: 4px; }
</style>
