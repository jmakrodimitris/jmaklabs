<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JMAK Labs</title>
  <style>
    /* ── Reset & Base ── */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      font-family: 'Segoe UI', Arial, sans-serif;
      overflow: hidden;
      background: #0a0a0a;
    }

    /* ── Background ── */
    .bg {
      position: fixed;
      inset: 0;
      background: url('background.png') center/cover no-repeat;
      filter: brightness(0.5);
      z-index: 0;
    }

    /* ── Content ── */
    .content {
      position: relative;
      z-index: 1;
      width: 100%;
      display: flex;
      justify-content: center;
      padding-top: 50px;
      animation: fadeIn 1.2s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Button Row ── */
    .buttons {
      display: flex;
      gap: 40px;
      flex-wrap: wrap;
      justify-content: center;
    }

    /* ── Animated Button ── */
    .btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 18px 44px;
      font-size: 1.15rem;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #fff;
      text-decoration: none;
      border: 2px solid rgba(255,255,255,0.35);
      border-radius: 60px;
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      cursor: pointer;
      overflow: hidden;
      transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    /* Gradient sweep on hover */
    .btn::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    .btn-files::before {
      background: linear-gradient(135deg, rgba(59,130,246,0.35), rgba(37,99,235,0.2));
    }

    .btn-jellyfin::before {
      background: linear-gradient(135deg, rgba(139,92,246,0.35), rgba(109,40,217,0.2));
    }

    .btn:hover::before {
      opacity: 1;
    }

    .btn:hover {
      border-color: rgba(255,255,255,0.7);
      transform: translateY(-4px) scale(1.04);
      box-shadow:
        0 14px 40px rgba(0,0,0,0.4),
        0 0 30px rgba(255,255,255,0.08);
    }

    .btn:active {
      transform: translateY(-1px) scale(1.01);
      transition-duration: 0.1s;
    }

    /* Icon */
    .btn svg {
      width: 22px;
      height: 22px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      position: relative;
      z-index: 1;
      transition: transform 0.3s ease;
    }

    .btn:hover svg {
      transform: scale(1.15);
    }

    .btn span {
      position: relative;
      z-index: 1;
    }

    /* Shine sweep */
    .btn::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -75%;
      width: 50%;
      height: 200%;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,0.15),
        transparent
      );
      transform: skewX(-20deg);
      transition: left 0.6s ease;
    }

    .btn:hover::after {
      left: 125%;
    }

    /* Pulse ring animation */
    @keyframes pulseRing {
      0%   { box-shadow: 0 0 0 0 rgba(255,255,255,0.18); }
      70%  { box-shadow: 0 0 0 12px rgba(255,255,255,0); }
      100% { box-shadow: 0 0 0 0 rgba(255,255,255,0); }
    }

    .btn:hover {
      animation: pulseRing 1.8s ease-out infinite;
    }

    /* ── Responsive ── */
    @media (max-width: 520px) {
      .buttons { gap: 24px; }
      .btn {
        padding: 16px 34px;
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>

  <div class="bg"></div>

  <div class="content">
    <div class="buttons">
      <!-- Files Button -->
      <a href="https://files.jmaklabs.com" class="btn btn-files">
        <svg viewBox="0 0 24 24">
          <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
        </svg>
        <span>Files</span>
      </a>

      <!-- Jellyfin Button -->
      <a href="https://jellyfin.jmaklabs.com" class="btn btn-jellyfin">
        <svg viewBox="0 0 24 24">
          <polygon points="5 3 19 12 5 21 5 3"/>
        </svg>
        <span>Jellyfin</span>
      </a>
    </div>
  </div>

</body>
</html>
