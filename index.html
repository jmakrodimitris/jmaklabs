    * { box-sizing: border-box; }
    html { min-height: 100%; background: #030711; }
    body { isolation: isolate; margin: 0; min-height: 100vh; min-height: 100svh; color: #fff; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body {

    }
    main { min-height: 100vh; min-height: 100svh; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; padding: 6.75rem 1.25rem max(2rem, env(safe-area-inset-bottom)); }
    .brand-wordmark{position:absolute;top:46px;right:24px;width:150px;text-align:center;color:#fff;text-shadow:0 3px 10px #0008;text-decoration:none;z-index:10}.brand-main{display:block;font-family:Impact,"Arial Black",sans-serif;font-size:46px;font-weight:900;font-style:italic;letter-spacing:-2px;line-height:1.05;transform:skew(-8deg)}.brand-sub{display:block;margin-top:5px;font-size:12px;font-weight:600;letter-spacing:5px;white-space:nowrap}
    @media (max-width: 600px) { .brand-wordmark { right: 16px; width: 125px; } .brand-main { font-size: 40px; } .brand-sub { font-size: 10px; letter-spacing: 4px; } }
    .welcome {
      width: min(100%, 57rem);
      margin: auto 0;
      padding: 0 0 2rem;
      text-align: center;
      animation: arrive 900ms ease-out both;
    }
    .holiday-art {
      display: block;
      width: 100%;
      max-width: 50rem;
      height: auto;
      margin: 0 auto;
      mask-image: linear-gradient(to right, transparent, #000 19%, #000 81%, transparent),
                  linear-gradient(to bottom, transparent, #000 15%, #000 76%, transparent);
      mask-composite: intersect;
    }
    .welcome h1 {
      margin: 0;
      color: #fff8ed;
      font-size: clamp(1.8rem, 4.5vw, 3rem);
      font-weight: 650;
      letter-spacing: -.035em;
      line-height: 1.12;
      text-wrap: balance;
    }
    .welcome p {
      margin: .65rem 0 0;
      color: #ced9e8;
      font-size: clamp(.95rem, 2vw, 1.1rem);
      line-height: 1.6;
      text-wrap: balance;
    }
    .social-links { position: absolute; top: max(2.85rem, env(safe-area-inset-top)); left: 1.25rem; display: grid; grid-template-columns: repeat(4, 3rem); gap: .65rem; }
    .social-links .social-button { width: 3rem; height: 3rem; min-height: 3rem; padding: .75rem; font-family: inherit; cursor: pointer; }
    .social-button:disabled { opacity: 1; color: #fff; cursor: default; }
    .social-button svg { width: 1.5rem; height: 1.5rem; }
    @media (max-width: 480px) { .social-links { grid-template-columns: repeat(2, 3rem); gap: .5rem; } main { padding-top: 11rem; } }
    .gateway { width: min(100%, 35rem); text-align: center; padding-bottom: clamp(0rem, 4vh, 3rem); animation: arrive 900ms ease-out both; }
    .eyebrow { margin: 0 0 1rem; font-size: .7rem; font-weight: 500; letter-spacing: .32em; text-transform: uppercase; color: rgb(255 255 255 / 75%); }
    nav { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1rem; }
    .button { position: relative; display: flex; align-items: center; justify-content: center; gap: .8rem; min-height: 4rem; padding: 1rem 1.25rem; border: 1px solid rgb(255 255 255 / 35%); border-radius: 1rem; background: rgb(14 26 46 / 85%); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); box-shadow: 0 8px 30px rgb(0 0 0 / 18%); color: white; text-decoration: none; font-size: 1.05rem; font-weight: 550; transition: transform 240ms ease, border-color 240ms ease, background 240ms ease, box-shadow 240ms ease; }
    .button::before { content: ""; position: absolute; inset: 0; border-radius: inherit; background: linear-gradient(90deg, transparent, rgb(255 255 255 / 15%), transparent); animation: shimmer 7s ease-in-out infinite; pointer-events: none; }
    .button:nth-child(2)::before { animation-delay: 1s; }
    .button:nth-child(3)::before { animation-delay: 2s; }
    .button:nth-child(4)::before { animation-delay: 3s; }
    .button:hover { transform: translateY(-5px); border-color: #ff888e; background: #341b2a; box-shadow: 0 12px 35px rgb(0 0 0 / 30%), 0 0 22px rgb(255 79 94 / 20%); }
    .button:focus-visible { outline: 3px solid #ffd09b; outline-offset: 5px; }
    .button:active { transform: translateY(-1px) scale(.98); }
    svg { width: 1.3rem; height: 1.3rem; flex-shrink: 0; }
    .arrow { margin-left: auto; color: #ffc58c; transition: transform 240ms ease; }
    .button:hover .arrow { transform: translate(2px, -2px); }
    .label { margin-right: auto; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    @keyframes arrive { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes shimmer {
      0%, 65% { background-position: 100% 0; }
      90%, 100% { background-position: 0 0; }
    }
    @media (max-width: 420px) { nav { gap: .65rem; } .button { padding: 1rem; gap: .55rem; } }

    .holiday-lights {
      position: absolute;
      inset: 0 0 auto;
      display: flex;
      height: 30px;
      pointer-events: none;
    }
    .holiday-lights span {
      --bulb: #ffce81;
      flex: 1;
      position: relative;
      height: 16px;
      border-bottom: 2px solid #36534a;
      border-radius: 0 0 50% 50%;
    }
    .holiday-lights span:nth-child(3n + 1) { --bulb: #ff717c; }
    .holiday-lights span:nth-child(3n + 2) { --bulb: #84dbb6; }
    .holiday-lights span::after {
      content: "";
      position: absolute;
      top: 100%;
      left: 50%;
      width: 7px;
      height: 11px;
      border-top: 3px solid #36534a;
      border-radius: 2px 2px 50% 50%;
      background: var(--bulb);
      box-shadow: 0 3px 11px var(--bulb);
      transform: translateX(-50%);
    }

    .brand-sub { color: #ffe7da; }
    @supports (background-clip: text) {
      .brand-main {
        background-image: repeating-linear-gradient(135deg, #fff8ef 0 9px, #e8475a 9px 15px);
        background-clip: text;
        color: transparent;
        text-shadow: none;
        filter: drop-shadow(0 2px 4px #000b);
      }
    }

    .button {
      background: linear-gradient(160deg, #17382f, #0c1c23 78%) padding-box,
                  repeating-linear-gradient(135deg, #e65365 0 7px, #ffefda 7px 14px) border-box;
      border: 2px solid transparent;
    }
    .button:hover {
      border-color: transparent;
      box-shadow: 0 12px 35px #0005, 0 0 16px #ffbf7b38;
      background: linear-gradient(160deg, #215044, #112927 78%) padding-box,
                  repeating-linear-gradient(135deg, #ff6575 0 7px, #fff5e8 7px 14px) border-box;
    }
    .button::before {
      background: linear-gradient(110deg, transparent 42%, #ffd08c30 50%, transparent 58%) 100% 0 / 300% 100% no-repeat;
    }

    @media (max-width: 480px) {
      .holiday-lights span:nth-child(even) { display: none; }
    }
    .snowfall {
      position: fixed;
      inset: 0;
      z-index: -1;
      overflow: hidden;
      pointer-events: none;
    }
    .snowfall span, .landing-flake {
      position: absolute;
      border-radius: 50%;
      background: #f6fbff;
      pointer-events: none;
    }
    .snowfall span {
      top: -12px;
      left: var(--left);
      width: var(--size);
      height: var(--size);
      opacity: var(--opacity);
      box-shadow: 0 0 5px #e4f1ff70;
      animation: snowfall var(--duration) var(--delay) linear infinite;
    }
    @keyframes snowfall {
      from { transform: translate3d(0, 0, 0); }
      to { transform: translate3d(var(--drift), calc(100vh + 24px), 0); }
    }

    .button::after {
      content: "";
      position: absolute;
      top: -5px;
      left: 18%;
      width: 48%;
      height: 6px;
      border-radius: 65% 85% 36% 48%;
      background: linear-gradient(#fff, #c9e3ff);
      box-shadow: 0 2px 5px #b5d8ff50;
      pointer-events: none;
    }
    .button:nth-child(even)::after { left: 34%; }
    .landing-flake {
      top: -7px;
      left: 46%;
      width: 4px;
      height: 4px;
      opacity: 0;
      animation: settle-on-button 5.8s linear infinite;
    }
    .button:nth-child(2) .landing-flake { animation-delay: -1.6s; }
    .button:nth-child(3) .landing-flake { animation-delay: -3s; }
    .button:nth-child(4) .landing-flake { animation-delay: -4.4s; }
    @keyframes settle-on-button {
      0%, 38% { opacity: 0; transform: translate(-9px, -25px); }
      47% { opacity: .8; }
      73% { opacity: .9; transform: translate(0, 0); }
      85% { opacity: 0; transform: translate(0, 0); }
      100% { opacity: 0; }
    }
    @media (max-width: 480px) {
      .snowfall span:nth-child(3n) { display: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      .snowfall, .landing-flake { display: none; }
    }
</style>
